services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    environment:
      MOSQUITTO_DYNSEC_PASSWORD: ${MQTT_ADMIN_PASSWORD}
    ports:
      - "8883:8883"
    networks:
      default:
        aliases:
          - mqtt.aerogreen.vn # lets the API validate the certificate hostname internally
    volumes:
      - ./mosquitto/mosquitto.production.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto-certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u admin -P \"$$MOSQUITTO_DYNSEC_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null"]
      interval: 10s
      timeout: 7s
      retries: 6

  api:
    build: .
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-1.00}"
          memory: ${API_MEMORY_LIMIT:-512M}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: api.aerogreen.vn
      Cors__AllowedOrigins__0: https://app.aerogreen.vn
      Cors__AllowPrivateLanOrigins: "false"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: IOTAgriBackend
      Jwt__Audience: IOTAgriBackendClients
      Jwt__Key: ${JWT_KEY}
      AdminBootstrap__Email: ${ADMIN_BOOTSTRAP_EMAIL:-}
      AdminBootstrap__Password: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      AdminBootstrap__FullName: ${ADMIN_BOOTSTRAP_FULL_NAME:-Administrator}
      Mqtt__Host: mqtt.aerogreen.vn
      Mqtt__Port: 8883
      Mqtt__UseTls: "true"
      Mqtt__Username: api
      Mqtt__Password: ${MQTT_API_PASSWORD}
      Mqtt__ClientId: iotagribackend-production
      MqttBrokerAdmin__Host: mqtt.aerogreen.vn
      MqttBrokerAdmin__Port: 8883
      MqttBrokerAdmin__UseTls: "true"
      MqttBrokerAdmin__Username: admin
      MqttBrokerAdmin__Password: ${MQTT_ADMIN_PASSWORD}
      MqttBrokerAdmin__ClientId: iotagribackend-dynsec
      MqttBrokerAdmin__DeviceRole: device
      DeviceProvisioning__MqttHost: mqtt.aerogreen.vn
      PumpScheduling__Enabled: "false"
      PumpScheduling__PollSeconds: ${PUMP_SCHEDULING_POLL_SECONDS:-30}
      PumpScheduling__DueWindowSeconds: ${PUMP_SCHEDULING_DUE_WINDOW_SECONDS:-90}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: https://api.aerogreen.vn
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-log:
  caddy-data:
  caddy-config:
