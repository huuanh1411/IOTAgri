name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/tests/IOTAgriBackend.Tests.csproj

      - name: Test
        run: dotnet test backend/tests/IOTAgriBackend.Tests.csproj --configuration Release --no-restore

      - name: Build
        run: dotnet build backend/IOTAgriBackend.csproj --configuration Release --no-restore

      - name: Build Docker image
        run: docker build --tag iotagri-backend:ci .

      - name: Validate production Compose
        run: docker compose --env-file .env.production.example -f compose.production.yaml config

      - name: Validate deployment scripts
        run: bash -n deploy/backup-postgres.sh deploy/bootstrap-mqtt-dynsec.sh deploy/sync-mqtt-certs.sh deploy/verify-mqtt-security.sh

      - name: Validate production firmware contract
        run: python3 -m unittest firmware.ESP32DeviceSetup.tests.test_production_contract -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze

      - name: Test
        working-directory: frontend
        run: flutter test

      - name: Build web release
        working-directory: frontend
        run: flutter build web --release --dart-define=API_BASE_URL=https://api.aerogreen.vn
