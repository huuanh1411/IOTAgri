name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            'set -euo pipefail
            cd /opt/iotagri
            git pull --ff-only origin main
            test -s deploy/mosquitto-certs/server.crt
            test -s deploy/mosquitto-certs/server.key
            docker compose --env-file .env.production -f compose.production.yaml up -d --build --remove-orphans
            docker compose --env-file .env.production -f compose.production.yaml ps
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error https://api.aerogreen.vn/health; then
                exit 0
              fi
              sleep 5
            done
            exit 1'
