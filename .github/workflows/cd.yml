name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  # Cancelling SSH can leave the Docker daemon building after the runner exits.
  # Queue newer releases so two builds never compete for VPS resources.
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          timeout 35m ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=5 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$DEPLOY_SHA'" <<'REMOTE_SCRIPT'
            set -euo pipefail
            deploy_sha=$1
            cd /opt/iotagri
            exec 9>/tmp/iotagri-production-deploy.lock
            flock -w 300 9 || {
              echo 'Another production deployment still holds the VPS lock.' >&2
              exit 1
            }
            # Preserve tracked VPS changes while leaving local operational files untouched.
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              git stash push -m "pre-deploy-$deploy_sha"
            fi
            git fetch --prune origin main
            git merge-base --is-ancestor "$deploy_sha" FETCH_HEAD || {
              echo 'Requested deployment commit is not on origin/main.' >&2
              exit 1
            }
            git switch --detach "$deploy_sha"
            test -s deploy/mosquitto-certs/server.crt
            test -s deploy/mosquitto-certs/server.key
            compose=(docker compose --env-file .env.production -f compose.production.yaml)
            export COMPOSE_PARALLEL_LIMIT=1
            # Finish every image before replacing a running container. Serial
            # builds prevent Flutter and .NET from exhausting a small VPS.
            # Keep the deployment lock in this shell only.  Docker Compose
            # must not inherit it, or a cancelled runner can leave a child
            # process holding the lock after SSH has exited.
            timeout --foreground --signal=TERM --kill-after=30s 25m "${compose[@]}" build 9>&-
            "${compose[@]}" up -d --no-build --remove-orphans 9>&-
            "${compose[@]}" ps 9>&-
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error https://api.aerogreen.vn/health; then
                exit 0
              fi
              sleep 5
            done
            exit 1
          REMOTE_SCRIPT
