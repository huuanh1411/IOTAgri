name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  # A newer main commit must not wait forever behind a stalled remote deploy.
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          timeout 60m ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=5 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$DEPLOY_SHA'" <<'REMOTE_SCRIPT'
            set -euo pipefail
            deploy_sha=$1
            cd /opt/iotagri
            # Preserve tracked VPS changes while leaving local operational files untouched.
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              git stash push -m "pre-deploy-$deploy_sha"
            fi
            git fetch --prune origin main
            git merge-base --is-ancestor "$deploy_sha" FETCH_HEAD || {
              echo 'Requested deployment commit is not on origin/main.' >&2
              exit 1
            }
            git switch --detach "$deploy_sha"
            test -s deploy/mosquitto-certs/server.crt
            test -s deploy/mosquitto-certs/server.key
            compose=(docker compose --env-file .env.production -f compose.production.yaml)
            cert_root=/data/caddy/certificates/acme-v02.api.letsencrypt.org-directory
            cert_backup_suffix=".pre-x1-$deploy_sha"
            cert_rotation=false
            rollback_cert_rotation() {
              $cert_rotation || return 0
              for host in api.aerogreen.vn mqtt.aerogreen.vn; do
                "${compose[@]}" exec -T caddy sh -c '
                  src="$1/$2"
                  backup="$src$3"
                  failed="$src.failed-$4"
                  if [ -d "$backup" ]; then
                    if [ -d "$src" ]; then mv "$src" "$failed"; fi
                    mv "$backup" "$src"
                  fi
                ' sh "$cert_root" "$host" "$cert_backup_suffix" "$deploy_sha"
              done
              "${compose[@]}" restart caddy
            }
            if ! openssl s_client -connect 127.0.0.1:443 -servername api.aerogreen.vn -showcerts </dev/null 2>/dev/null | grep -q 'ISRG Root X1' ||
               ! openssl s_client -connect 127.0.0.1:443 -servername mqtt.aerogreen.vn -showcerts </dev/null 2>/dev/null | grep -q 'ISRG Root X1'; then
              cert_rotation=true
              trap rollback_cert_rotation ERR
              for host in api.aerogreen.vn mqtt.aerogreen.vn; do
                "${compose[@]}" exec -T caddy sh -c '
                  src="$1/$2"
                  backup="$src$3"
                  if [ -d "$src" ] && [ ! -e "$backup" ]; then mv "$src" "$backup"; fi
                ' sh "$cert_root" "$host" "$cert_backup_suffix"
              done
            fi
            "${compose[@]}" up -d --build --remove-orphans
            for attempt in $(seq 1 18); do
              api_chain=$(openssl s_client -connect 127.0.0.1:443 -servername api.aerogreen.vn -showcerts </dev/null 2>/dev/null || true)
              mqtt_chain=$(openssl s_client -connect 127.0.0.1:443 -servername mqtt.aerogreen.vn -showcerts </dev/null 2>/dev/null || true)
              if grep -q 'ISRG Root X1' <<<"$api_chain" && grep -q 'ISRG Root X1' <<<"$mqtt_chain"; then
                break
              fi
              sleep 5
            done
            grep -q 'ISRG Root X1' <<<"$api_chain"
            grep -q 'ISRG Root X1' <<<"$mqtt_chain"
            trap - ERR
            if [ "$(id -u)" -eq 0 ]; then
              systemctl start iotagri-mqtt-cert-sync.service
            else
              sudo -n systemctl start iotagri-mqtt-cert-sync.service
            fi
            "${compose[@]}" ps
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error https://api.aerogreen.vn/health; then
                exit 0
              fi
              sleep 5
            done
            exit 1
          REMOTE_SCRIPT
