name: System E2E
on:
  workflow_dispatch:
  push:
    branches: [Test]
    paths:
      - 'testing/e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'testing/e2e/**'
      - '.github/workflows/e2e.yml'
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  system-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: testing/e2e/package-lock.json
      - run: npm ci
        working-directory: testing/e2e
      - run: node testing/e2e/scripts/run.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-e2e-${{ github.run_id }}
          path: testing/e2e/artifacts/
          retention-days: 14
          if-no-files-found: warn
