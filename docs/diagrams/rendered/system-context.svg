<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" role="img" aria-labelledby="title desc">
<title id="title">Context Diagram — IOTAgri</title>
<desc id="desc">Năm thực thể bên ngoài cách đều nhau 72 độ quanh vòng tròn IOTAgri. Chín mũi tên biểu diễn hướng luồng dữ liệu.</desc>
