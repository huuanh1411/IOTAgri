<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">IOTAgri — Dịch vụ email SMTP</title>
<desc id="desc">Actor đứng ngoài bên trái khung hệ thống IOTAgri, tên dưới hình người que. Các use case bố trí so le trong khung, nối trực tiếp bằng đoạn thẳng.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" fill="#17212b">
<g data-actor="SMTP" transform="translate(0 0)">
<text x="600" y="45" text-anchor="middle" font-size="24" font-weight="bold">IOTAgri — Dịch vụ email SMTP</text>
<rect data-system="IOTAgri" x="240" y="80" width="930" height="770" rx="8" fill="#f1eef5" stroke="#51485c" stroke-width="1.8"/>
<rect x="240" y="59" width="150" height="30" rx="5" fill="#7138a0"/>
<g fill="white"><text x="315" y="80" text-anchor="middle" font-size="17" font-weight="bold">IOTAgri</text></g>
<line data-usecase="SMTPUC1" x1="155" y1="438" x2="511.29" y2="445.57" stroke="#7138a0" stroke-width="1.6"/>
<ellipse data-usecase="SMTPUC1" cx="720" cy="450" rx="210" ry="40" fill="#FFFFFF" stroke="#7138a0" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="720" y="456.0" text-anchor="middle" font-size="16" font-weight="normal">Quên mật khẩu / Đặt lại mật khẩu</text>
<g fill="none" stroke="#17212b" stroke-width="2.5"><circle cx="120" cy="398" r="15"/><path d="M120 413 V462 M85 438 L120 423 L155 438 M120 462 L96 497 M120 462 L144 497"/></g>
<text x="120" y="522" text-anchor="middle" font-size="16" font-weight="normal">Dịch vụ email</text>
<text x="120" y="543" text-anchor="middle" font-size="16" font-weight="normal">SMTP</text>
</g>
</g>
</svg>
