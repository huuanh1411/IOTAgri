<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">IOTAgri — Người dùng đã đăng nhập</title>
<desc id="desc">Actor đứng ngoài bên trái khung hệ thống IOTAgri, tên dưới hình người que. Các use case bố trí so le trong khung, nối trực tiếp bằng đoạn thẳng.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" fill="#17212b">
<g data-actor="User" transform="translate(0 0)">
<text x="600" y="45" text-anchor="middle" font-size="24" font-weight="bold">IOTAgri — Người dùng đã đăng nhập</text>
<rect data-system="IOTAgri" x="240" y="80" width="930" height="770" rx="8" fill="#f1eef5" stroke="#51485c" stroke-width="1.8"/>
<rect x="240" y="59" width="150" height="30" rx="5" fill="#7138a0"/>
<g fill="white"><text x="315" y="80" text-anchor="middle" font-size="17" font-weight="bold">IOTAgri</text></g>
<line data-usecase="UserUC1" x1="155" y1="438" x2="260.00" y2="200.00" stroke="#7138a0" stroke-width="1.6"/>
<line data-usecase="UserUC2" x1="155" y1="438" x2="785.68" y2="327.13" stroke="#7138a0" stroke-width="1.6"/>
<line data-usecase="UserUC3" x1="155" y1="438" x2="260.00" y2="450.00" stroke="#7138a0" stroke-width="1.6"/>
<line data-usecase="UserUC4" x1="155" y1="438" x2="742.66" y2="586.32" stroke="#7138a0" stroke-width="1.6"/>
<line data-usecase="UserUC5" x1="155" y1="438" x2="260.00" y2="700.00" stroke="#7138a0" stroke-width="1.6"/>
<ellipse data-usecase="UserUC1" cx="470" cy="200" rx="210" ry="40" fill="#FFFFFF" stroke="#7138a0" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="470" y="196.5" text-anchor="middle" font-size="16" font-weight="normal">UC-02,04: Phiên đăng nhập / Hồ sơ /</text>
<text x="470" y="215.5" text-anchor="middle" font-size="16" font-weight="normal">Mật khẩu</text>
<ellipse data-usecase="UserUC2" cx="940" cy="300" rx="210" ry="40" fill="#FFFFFF" stroke="#7138a0" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="940" y="306.0" text-anchor="middle" font-size="16" font-weight="normal">UC-05–06: Thiết bị / Tạo mã ghép nối</text>
<ellipse data-usecase="UserUC3" cx="470" cy="450" rx="210" ry="40" fill="#FFFFFF" stroke="#7138a0" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="470" y="446.5" text-anchor="middle" font-size="16" font-weight="normal">UC-08–12: Giám sát / Điều khiển /</text>
<text x="470" y="465.5" text-anchor="middle" font-size="16" font-weight="normal">Lịch / Cảnh báo</text>
<ellipse data-usecase="UserUC4" cx="940" cy="600" rx="210" ry="40" fill="#FFFFFF" stroke="#7138a0" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="940" y="596.5" text-anchor="middle" font-size="16" font-weight="normal">UC-13: Tạo / Xem / Trao đổi phiếu hỗ</text>
<text x="940" y="615.5" text-anchor="middle" font-size="16" font-weight="normal">trợ</text>
<ellipse data-usecase="UserUC5" cx="470" cy="700" rx="210" ry="40" fill="#FFF7DB" stroke="#7138a0" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="470" y="706.0" text-anchor="middle" font-size="16" font-weight="normal">UC-17: Cây trồng / Cài đặt cục bộ</text>
<g fill="none" stroke="#17212b" stroke-width="2.5"><circle cx="120" cy="398" r="15"/><path d="M120 413 V462 M85 438 L120 423 L155 438 M120 462 L96 497 M120 462 L144 497"/></g>
<text x="120" y="522" text-anchor="middle" font-size="16" font-weight="normal">Người dùng đã</text>
<text x="120" y="543" text-anchor="middle" font-size="16" font-weight="normal">đăng nhập</text>
