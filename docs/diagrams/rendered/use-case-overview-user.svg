<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">IOTAgri — Người dùng đã đăng nhập</title>
<desc id="desc">Actor ở trung tâm, tên bên dưới hình người que. Các use case bố trí so le hai bên, nối trực tiếp bằng đoạn thẳng; không có khung bao.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" fill="#17212b">
<g data-actor="User" transform="translate(0 0)">
<text x="600" y="45" text-anchor="middle" font-size="24" font-weight="bold">IOTAgri — Người dùng đã đăng nhập</text>
<line data-usecase="UserUC1" x1="565" y1="378" x2="480" y2="230.0" stroke="#334155" stroke-width="1.5"/>
<ellipse data-usecase="UserUC1" cx="260" cy="230.0" rx="220" ry="43" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
<text x="260" y="226.0" text-anchor="middle" font-size="17" font-weight="normal">UC-02,04: Phiên đăng nhập / Hồ sơ / Mật</text>
<text x="260" y="246.0" text-anchor="middle" font-size="17" font-weight="normal">khẩu</text>
<line data-usecase="UserUC2" x1="635" y1="378" x2="720" y2="310.0" stroke="#334155" stroke-width="1.5"/>
<ellipse data-usecase="UserUC2" cx="940" cy="310.0" rx="220" ry="43" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
<text x="940" y="316.0" text-anchor="middle" font-size="17" font-weight="normal">UC-05–06: Thiết bị / Tạo mã ghép nối</text>
<line data-usecase="UserUC3" x1="565" y1="378" x2="480" y2="390.0" stroke="#334155" stroke-width="1.5"/>
<ellipse data-usecase="UserUC3" cx="260" cy="390.0" rx="220" ry="43" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
<text x="260" y="386.0" text-anchor="middle" font-size="17" font-weight="normal">UC-08–12: Giám sát / Điều khiển / Lịch</text>
<text x="260" y="406.0" text-anchor="middle" font-size="17" font-weight="normal">/ Cảnh báo</text>
<line data-usecase="UserUC4" x1="635" y1="378" x2="720" y2="470.0" stroke="#334155" stroke-width="1.5"/>
<ellipse data-usecase="UserUC4" cx="940" cy="470.0" rx="220" ry="43" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
<text x="940" y="466.0" text-anchor="middle" font-size="17" font-weight="normal">UC-13: Tạo / Xem / Trao đổi phiếu hỗ</text>
<text x="940" y="486.0" text-anchor="middle" font-size="17" font-weight="normal">trợ</text>
<line data-usecase="UserUC5" x1="565" y1="378" x2="480" y2="550.0" stroke="#334155" stroke-width="1.5"/>
<ellipse data-usecase="UserUC5" cx="260" cy="550.0" rx="220" ry="43" fill="#FFF7DB" stroke="#334155" stroke-width="1.4"/>
<text x="260" y="556.0" text-anchor="middle" font-size="17" font-weight="normal">UC-17: Cây trồng / Cài đặt cục bộ</text>
<g fill="none" stroke="#17212b" stroke-width="2.5"><circle cx="600" cy="338" r="15"/><path d="M600 353 V402 M565 378 L600 363 L635 378 M600 402 L576 437 M600 402 L624 437"/></g>
<text x="600" y="462" text-anchor="middle" font-size="16" font-weight="normal">Người dùng</text>
<text x="600" y="483" text-anchor="middle" font-size="16" font-weight="normal">đã đăng nhập</text>
</g>
