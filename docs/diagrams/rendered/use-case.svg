<svg xmlns="http://www.w3.org/2000/svg" width="980" height="2880" viewBox="0 0 980 2880" role="img" aria-labelledby="title desc">
<title id="title">IOTAgri — Use Case theo actor</title>
<desc id="desc">Mỗi actor có một khung hành động riêng. Actor là hình người que có tên bên dưới, nối bằng đoạn thẳng đến từng use case.</desc>
