<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" role="img" aria-labelledby="title desc">
<title id="title">IOTAgri — Thiết bị ESP32</title>
<desc id="desc">Mỗi actor có một khung hành động riêng. Actor là hình người que có tên bên dưới, nối bằng đoạn thẳng đến từng use case.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" fill="#17212b">
<text x="490" y="34" text-anchor="middle" font-size="23" font-weight="bold">IOTAgri — Thiết bị ESP32</text>
<g data-actor="ESP">
<rect x="300" y="75" width="650" height="330" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
<text x="625" y="103" text-anchor="middle" font-size="18" font-weight="bold">IOTAgri — Thiết bị ESP32</text>
<g fill="none" stroke="#17212b" stroke-width="2.5"><circle cx="100" cy="193.0" r="15"/><path d="M100 208.0 V257.0 M69 233.0 L100 218.0 L131 233.0 M100 257.0 L76 292.0 M100 257.0 L124 292.0"/></g>
<text x="100" y="317.0" text-anchor="middle" font-size="16" font-weight="normal">Thiết bị ESP32</text>
<line data-usecase="ESPUC1" x1="131" y1="233.0" x2="340" y2="155.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="ESPUC1" cx="625" cy="155.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
<text x="625" y="161.0" text-anchor="middle" font-size="17" font-weight="normal">Ghép nối phần cứng bằng mã</text>
<line data-usecase="ESPUC2" x1="131" y1="233.0" x2="340" y2="245.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="ESPUC2" cx="625" cy="245.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
<text x="625" y="251.0" text-anchor="middle" font-size="17" font-weight="normal">Gửi và lưu số liệu cảm biến</text>
<line data-usecase="ESPUC3" x1="131" y1="233.0" x2="340" y2="335.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="ESPUC3" cx="625" cy="335.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
