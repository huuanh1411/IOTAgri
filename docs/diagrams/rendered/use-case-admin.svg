<text x="940" y="396.0" text-anchor="middle" font-size="17" font-weight="normal">Xem tổng quan / Báo cáo / Xuất CSV</text>
<line data-usecase="AdminUC5" x1="565" y1="378" x2="480" y2="470.0" stroke="#334155" stroke-width="1.5"/>
