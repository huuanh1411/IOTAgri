<text x="260" y="626.0" text-anchor="middle" font-size="17" font-weight="normal">Làm mới phiên / Đăng xuất</text>
<text x="260" y="646.0" text-anchor="middle" font-size="17" font-weight="normal">Quản lý hồ sơ / Đổi mật khẩu</text>
<g fill="none" stroke="#17212b" stroke-width="2.5"><circle cx="600" cy="338" r="15"/><path d="M600 353 V402 M565 378 L600 363 L635 378 M600 402 L576 437 M600 402 L624 437"/></g>
<text x="600" y="462" text-anchor="middle" font-size="16" font-weight="normal">Quản trị</text>
<text x="600" y="483" text-anchor="middle" font-size="16" font-weight="normal">viên</text>
