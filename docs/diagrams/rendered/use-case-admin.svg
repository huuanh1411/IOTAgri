<text x="260" y="466.0" text-anchor="middle" font-size="17" font-weight="normal">Xem trạng thái hệ thống</text>
<text x="260" y="486.0" text-anchor="middle" font-size="17" font-weight="normal">Cấu hình ngưỡng mặc định</text>
<line data-usecase="AdminUC6" x1="635" y1="378" x2="720" y2="550.0" stroke="#334155" stroke-width="1.5"/>
