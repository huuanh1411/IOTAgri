<text x="470" y="176.5" text-anchor="middle" font-size="16" font-weight="normal">Làm mới phiên / Đăng xuất</text>
<text x="470" y="195.5" text-anchor="middle" font-size="16" font-weight="normal">Quản lý hồ sơ / Đổi mật khẩu</text>
