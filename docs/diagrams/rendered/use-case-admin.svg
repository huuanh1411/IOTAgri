<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">IOTAgri — Quản trị viên</title>
<desc id="desc">Actor ở trung tâm, tên bên dưới hình người que. Các use case bố trí so le hai bên, nối trực tiếp bằng đoạn thẳng; không có khung bao.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" fill="#17212b">
<g data-actor="Admin" transform="translate(0 0)">
<text x="600" y="45" text-anchor="middle" font-size="24" font-weight="bold">IOTAgri — Quản trị viên</text>
<line data-usecase="AdminUC1" x1="565" y1="378" x2="480" y2="150.0" stroke="#334155" stroke-width="1.5"/>
<ellipse data-usecase="AdminUC1" cx="260" cy="150.0" rx="220" ry="43" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
<text x="260" y="146.0" text-anchor="middle" font-size="17" font-weight="normal">Quản lý hồ sơ / Đổi mật khẩu</text>
<text x="260" y="166.0" text-anchor="middle" font-size="17" font-weight="normal">Đăng xuất</text>
<line data-usecase="AdminUC2" x1="635" y1="378" x2="720" y2="230.0" stroke="#334155" stroke-width="1.5"/>
