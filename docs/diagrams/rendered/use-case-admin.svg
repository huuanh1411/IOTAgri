<text x="940" y="556.0" text-anchor="middle" font-size="17" font-weight="normal">Xem nhật ký quản trị</text>
<line data-usecase="AdminUC7" x1="565" y1="378" x2="480" y2="630.0" stroke="#334155" stroke-width="1.5"/>
