<text x="940" y="226.0" text-anchor="middle" font-size="17" font-weight="normal">Xem tài khoản / Phân quyền</text>
<text x="940" y="246.0" text-anchor="middle" font-size="17" font-weight="normal">Khóa và mở khóa</text>
