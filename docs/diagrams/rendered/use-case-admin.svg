<text x="260" y="306.0" text-anchor="middle" font-size="17" font-weight="normal">Xem mọi thiết bị / Dữ liệu</text>
<text x="260" y="326.0" text-anchor="middle" font-size="17" font-weight="normal">Chuyển chủ sở hữu</text>
<line data-usecase="AdminUC4" x1="635" y1="378" x2="720" y2="390.0" stroke="#334155" stroke-width="1.5"/>
