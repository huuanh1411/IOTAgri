<text x="940" y="615.5" text-anchor="middle" font-size="16" font-weight="normal">trợ</text>
<ellipse data-usecase="UserUC5" cx="470" cy="700" rx="210" ry="40" fill="#FFF7DB" stroke="#7138a0" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="470" y="706.0" text-anchor="middle" font-size="16" font-weight="normal">UC-17: Cây trồng / Cài đặt cục bộ</text>
