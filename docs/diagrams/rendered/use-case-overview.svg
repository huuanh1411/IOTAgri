<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1980" viewBox="0 0 980 1980" role="img" aria-labelledby="title desc">
<title id="title">IOTAgri — Tổng quan Use Case theo actor</title>
<desc id="desc">Mỗi actor có một khung hành động riêng. Actor là hình người que có tên bên dưới, nối bằng đoạn thẳng đến từng use case.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" fill="#17212b">
<text x="490" y="34" text-anchor="middle" font-size="23" font-weight="bold">IOTAgri — Tổng quan Use Case theo actor</text>
<g data-actor="Guest">
<rect x="300" y="75" width="650" height="240" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
<text x="625" y="103" text-anchor="middle" font-size="18" font-weight="bold">IOTAgri — Khách</text>
<g fill="none" stroke="#17212b" stroke-width="2.5"><circle cx="100" cy="148.0" r="15"/><path d="M100 163.0 V212.0 M69 188.0 L100 173.0 L131 188.0 M100 212.0 L76 247.0 M100 212.0 L124 247.0"/></g>
<text x="100" y="272.0" text-anchor="middle" font-size="16" font-weight="normal">Khách</text>
<line data-usecase="GuestUC1" x1="131" y1="188.0" x2="340" y2="155.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="GuestUC1" cx="625" cy="155.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
<text x="625" y="161.0" text-anchor="middle" font-size="17" font-weight="normal">UC-01: Đăng ký / Đăng nhập</text>
<line data-usecase="GuestUC2" x1="131" y1="188.0" x2="340" y2="245.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="GuestUC2" cx="625" cy="245.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
<text x="625" y="251.0" text-anchor="middle" font-size="17" font-weight="normal">UC-03: Quên / Đặt lại mật khẩu</text>
</g>
<g data-actor="User">
<rect x="300" y="345" width="650" height="510" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
<text x="625" y="373" text-anchor="middle" font-size="18" font-weight="bold">IOTAgri — Người dùng đã đăng nhập</text>
<g fill="none" stroke="#17212b" stroke-width="2.5"><circle cx="100" cy="553.0" r="15"/><path d="M100 568.0 V617.0 M69 593.0 L100 578.0 L131 593.0 M100 617.0 L76 652.0 M100 617.0 L124 652.0"/></g>
<text x="100" y="677.0" text-anchor="middle" font-size="16" font-weight="normal">Người dùng đã</text>
<text x="100" y="699.0" text-anchor="middle" font-size="16" font-weight="normal">đăng nhập</text>
<line data-usecase="UserUC1" x1="131" y1="593.0" x2="340" y2="425.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="UserUC1" cx="625" cy="425.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
<text x="625" y="431.0" text-anchor="middle" font-size="17" font-weight="normal">UC-02,04: Phiên đăng nhập / Hồ sơ / Mật khẩu</text>
<line data-usecase="UserUC2" x1="131" y1="593.0" x2="340" y2="515.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="UserUC2" cx="625" cy="515.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
<text x="625" y="521.0" text-anchor="middle" font-size="17" font-weight="normal">UC-05–06: Thiết bị / Tạo mã ghép nối</text>
<line data-usecase="UserUC3" x1="131" y1="593.0" x2="340" y2="605.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="UserUC3" cx="625" cy="605.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
<text x="625" y="611.0" text-anchor="middle" font-size="17" font-weight="normal">UC-08–12: Giám sát / Điều khiển / Lịch / Cảnh báo</text>
<line data-usecase="UserUC4" x1="131" y1="593.0" x2="340" y2="695.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="UserUC4" cx="625" cy="695.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
<text x="625" y="701.0" text-anchor="middle" font-size="17" font-weight="normal">UC-13: Tạo / Xem / Trao đổi phiếu hỗ trợ</text>
<line data-usecase="UserUC5" x1="131" y1="593.0" x2="340" y2="785.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="UserUC5" cx="625" cy="785.0" rx="285" ry="34" fill="#FFF7DB" stroke="#334155"/>
<text x="625" y="791.0" text-anchor="middle" font-size="17" font-weight="normal">UC-17: Cây trồng / Cài đặt cục bộ</text>
</g>
<g data-actor="Admin">
<rect x="300" y="885" width="650" height="420" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
<text x="625" y="913" text-anchor="middle" font-size="18" font-weight="bold">IOTAgri — Quản trị viên</text>
<g fill="none" stroke="#17212b" stroke-width="2.5"><circle cx="100" cy="1048.0" r="15"/><path d="M100 1063.0 V1112.0 M69 1088.0 L100 1073.0 L131 1088.0 M100 1112.0 L76 1147.0 M100 1112.0 L124 1147.0"/></g>
<text x="100" y="1172.0" text-anchor="middle" font-size="16" font-weight="normal">Quản trị viên</text>
<line data-usecase="AdminUC1" x1="131" y1="1088.0" x2="340" y2="965.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="AdminUC1" cx="625" cy="965.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
<text x="625" y="971.0" text-anchor="middle" font-size="17" font-weight="normal">UC-02,04: Phiên đăng nhập / Hồ sơ / Mật khẩu</text>
<line data-usecase="AdminUC2" x1="131" y1="1088.0" x2="340" y2="1055.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="AdminUC2" cx="625" cy="1055.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
<text x="625" y="1061.0" text-anchor="middle" font-size="17" font-weight="normal">UC-13: Phản hồi / Quản lý phiếu hỗ trợ</text>
<line data-usecase="AdminUC3" x1="131" y1="1088.0" x2="340" y2="1145.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="AdminUC3" cx="625" cy="1145.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
<text x="625" y="1151.0" text-anchor="middle" font-size="17" font-weight="normal">UC-14–15: Tài khoản / Thiết bị toàn hệ thống</text>
<line data-usecase="AdminUC4" x1="131" y1="1088.0" x2="340" y2="1235.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="AdminUC4" cx="625" cy="1235.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
<text x="625" y="1241.0" text-anchor="middle" font-size="17" font-weight="normal">UC-16: Báo cáo / Cấu hình / Nhật ký quản trị</text>
</g>
<g data-actor="ESP">
<rect x="300" y="1335" width="650" height="330" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
<text x="625" y="1363" text-anchor="middle" font-size="18" font-weight="bold">IOTAgri — Thiết bị ESP32</text>
<g fill="none" stroke="#17212b" stroke-width="2.5"><circle cx="100" cy="1453.0" r="15"/><path d="M100 1468.0 V1517.0 M69 1493.0 L100 1478.0 L131 1493.0 M100 1517.0 L76 1552.0 M100 1517.0 L124 1552.0"/></g>
<text x="100" y="1577.0" text-anchor="middle" font-size="16" font-weight="normal">Thiết bị ESP32</text>
<line data-usecase="ESPUC1" x1="131" y1="1493.0" x2="340" y2="1415.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="ESPUC1" cx="625" cy="1415.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
<text x="625" y="1421.0" text-anchor="middle" font-size="17" font-weight="normal">UC-06: Ghép nối phần cứng bằng mã</text>
<line data-usecase="ESPUC2" x1="131" y1="1493.0" x2="340" y2="1505.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="ESPUC2" cx="625" cy="1505.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
<text x="625" y="1511.0" text-anchor="middle" font-size="17" font-weight="normal">UC-07: Gửi số liệu cảm biến</text>
<line data-usecase="ESPUC3" x1="131" y1="1493.0" x2="340" y2="1595.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="ESPUC3" cx="625" cy="1595.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
<text x="625" y="1601.0" text-anchor="middle" font-size="17" font-weight="normal">UC-18: Nhận lệnh bơm, đèn / Gửi trạng thái</text>
</g>
<g data-actor="SMTP">
<rect x="300" y="1695" width="650" height="230" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
<text x="625" y="1723" text-anchor="middle" font-size="18" font-weight="bold">IOTAgri — Dịch vụ email SMTP</text>
<g fill="none" stroke="#17212b" stroke-width="2.5"><circle cx="100" cy="1763.0" r="15"/><path d="M100 1778.0 V1827.0 M69 1803.0 L100 1788.0 L131 1803.0 M100 1827.0 L76 1862.0 M100 1827.0 L124 1862.0"/></g>
<text x="100" y="1887.0" text-anchor="middle" font-size="16" font-weight="normal">Dịch vụ email</text>
<text x="100" y="1909.0" text-anchor="middle" font-size="16" font-weight="normal">SMTP</text>
<line data-usecase="SMTPUC1" x1="131" y1="1803.0" x2="340" y2="1815.0" stroke="#334155" stroke-width="1.4"/>
<ellipse data-usecase="SMTPUC1" cx="625" cy="1815.0" rx="285" ry="34" fill="#FFFFFF" stroke="#334155"/>
<text x="625" y="1821.0" text-anchor="middle" font-size="17" font-weight="normal">UC-03: Chuyển email khôi phục mật khẩu</text>
</g>
</g>
</svg>
