server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The application shell keeps stable filenames. Force browsers to
    # revalidate them so a deployment cannot continue running an older build.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Retained for old tabs whose bootstrap still references the stable name.
    location = /main.dart.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # New bootstraps reference a content-addressed bundle that is safe to cache.
    location ~ "^/main\.[0-9a-f]{12}\.dart\.js$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
